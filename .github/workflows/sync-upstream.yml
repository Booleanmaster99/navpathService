# Daily: merge ShaggyHW/navpathService main into this fork's main, keeping local
# commits (e.g. the Windows build fix) on top. A conflict fails the run (GitHub emails you).
name: Sync upstream

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ShaggyHW/navpathService.git
          git fetch upstream main
          git merge --no-edit upstream/main -m "Merge ShaggyHW/navpathService main"
          git push
